<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Decoding HCM</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand-container">
            <div class="brand-logo">HCM</div>
            <div class="brand-title">DECODING HCM — ADMIN</div>
        </a>
    </nav>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="#" class="active" id="nav-dash">Dashboard</a>
            <a href="#" id="nav-tests">Manage Passages</a>
            <a href="#" id="nav-attempts">All Candidate Attempts</a>
            <a href="#" onclick="AuthManager.logout()">Logout</a>
        </aside>

        <main class="admin-content" id="admin-main-view">
            <h2>System Overview</h2>
            <div class="grid-3" style="margin-top: 1rem;">
                <div class="stat-box">
                    <div class="stat-value" id="adm-total-attempts">0</div>
                    <div class="stat-label">Total Test Attempts</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="adm-total-passages">0</div>
                    <div class="stat-label">Active Passages</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="adm-avg-wpm">0</div>
                    <div class="stat-label">Avg Net WPM</div>
                </div>
            </div>

            <div class="card" style="margin-top: 2rem;">
                <h3 class="card-title">Add New Exam Passage</h3>
                <form id="add-passage-form">
                    <div class="form-group">
                        <label class="form-label">Passage Title</label>
                        <input type="text" id="pass-title" class="form-control" required placeholder="e.g. BSF Set 1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Language</label>
                        <select id="pass-lang" class="form-control">
                            <option value="English">English</option>
                            <option value="Hindi">Hindi</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Passage Text Payload</label>
                        <textarea id="pass-text" class="form-control" style="height: 150px;" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Publish Passage</button>
                </form>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
