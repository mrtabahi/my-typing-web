<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Decoding HCM Typing Test Lab</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand-container">
            <div class="brand-logo">HCM</div>
            <div class="brand-title">DECODING HCM</div>
        </a>
    </nav>

    <div class="container" style="max-width: 450px; margin-top: 3rem;">
        <div class="card">
            <h2 class="card-title" style="text-align: center;">Account Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="login-email" class="form-control" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            try {
                await AuthManager.login(email, pass);
                window.location.href = 'dashboard.html';
            } catch (err) {
                alert("Login Failed: " + err.message);
            }
        });
    </script>
</body>
</html>
